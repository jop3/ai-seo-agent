services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-agent-api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_BASE=http://model-runner.docker.internal/engines/llama.cpp/v1
      - OPENAI_API_KEY=not-needed
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./credentials:/app/credentials:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - seo-agent-network

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: seo-agent-worker
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_BASE=http://model-runner.docker.internal/engines/llama.cpp/v1
      - OPENAI_API_KEY=not-needed
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./credentials:/app/credentials:ro
    restart: unless-stopped
    networks:
      - seo-agent-network

  redis:
    image: redis:7-alpine
    container_name: seo-agent-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seo-agent-network

  # NOTE: Using Docker Model Runner (external)
  # Docker Model Runner runs outside of docker-compose
  # Start it via Docker Desktop UI with your chosen model (e.g., Phi-3)
  # API will be available at: http://host.docker.internal:8080/v1
  # See DOCKER_MODEL_RUNNER_SETUP.md for setup instructions

  # Web UI (Chat, Dashboard, Settings - all in one)
  # Access at: http://localhost:8080
  #   - /          Chat with agents
  #   - /dashboard Analytics & metrics
  #   - /settings  LLM & site configuration
  ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-agent-ui
    command: python -m uvicorn src.ui.app:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_BASE=http://model-runner.docker.internal/engines/llama.cpp/v1
      - OPENAI_API_KEY=not-needed
      - OPENAI_MODEL=ai/phi4:latest
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./src:/app/src:ro
      - ./config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    profiles:
      - with-ui
    networks:
      - seo-agent-network

  # Optional: Celery beat for scheduled tasks
  # To use: docker-compose --profile with-scheduler up
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seo-agent-scheduler
    command: celery -A src.tasks beat --loglevel=info
    environment:
      - APP_ENV=development
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - with-scheduler
    networks:
      - seo-agent-network

networks:
  seo-agent-network:
    driver: bridge

volumes:
  redis_data:
