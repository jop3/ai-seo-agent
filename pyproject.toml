[project]
name = "ai-seo-agent"
version = "0.1.0"
description = "AI-powered SEO optimization agent for detecting and responding to AI Overview traffic impact"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AI SEO Agent Team" }]

dependencies = [
    # Core
    "fastapi>=0.109.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "pydantic>=2.5.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",

    # Azure (pin major versions to avoid conflicts)
    "azure-identity>=1.15.0,<2.0.0",
    "azure-cosmos>=4.5.0,<5.0.0",
    "azure-storage-blob>=12.19.0,<13.0.0",
    "azure-keyvault-secrets>=4.7.0,<5.0.0",
    "azure-monitor-opentelemetry>=1.2.0,<2.0.0",
    "openai>=1.12.0,<2.0.0",  # Azure OpenAI compatible

    # HTTP & Async
    "httpx>=0.26.0,<1.0.0",
    "aiohttp>=3.9.0,<4.0.0",

    # Data processing (ensure compatibility)
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.26.0,<2.0.0",

    # Google APIs
    "google-api-python-client>=2.111.0,<3.0.0",
    "google-auth>=2.25.0,<3.0.0",
    "google-auth-oauthlib>=1.2.0,<2.0.0",

    # Web scraping & browser automation
    "playwright>=1.41.0,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=5.1.0,<6.0.0",

    # Scheduling & tasks
    "apscheduler>=3.10.0,<4.0.0",  # 3.x for stability, 4.x is alpha
    "celery[redis]>=5.3.0,<6.0.0",

    # CLI
    "typer>=0.9.0,<1.0.0",
    "rich>=13.7.0,<14.0.0",

    # Utilities
    "python-dotenv>=1.0.0,<2.0.0",
    "structlog>=24.1.0,<25.0.0",
    "tenacity>=8.2.0,<9.0.0",
]

[project.optional-dependencies]
azure-agents = [
    # Azure AI Agent Service (beta)
    "azure-ai-projects>=1.0.0b1,<2.0.0",
]

m365 = [
    # Full Bot Framework for Teams (pin versions)
    "botbuilder-core>=4.14.0,<5.0.0",
    "botbuilder-schema>=4.14.0,<5.0.0",
    "botbuilder-integration-aiohttp>=4.14.0,<5.0.0",
]

dev = [
    "pytest>=7.4.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<5.0.0",
    "mypy>=1.8.0,<2.0.0",
    "ruff>=0.1.0,<1.0.0",
    "pre-commit>=3.6.0,<4.0.0",
]

all = [
    "ai-seo-agent[azure-agents,m365,dev]",
]

[project.scripts]
seo-agent = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
